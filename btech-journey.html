    <!-- Standard Navigation, Theme & Drawer Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();

            // Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark', 'dark-theme');
                    localStorage.setItem('portfolio-theme', 'dark');
                    localStorage.setItem('gkm_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark', 'dark-theme');
                    localStorage.setItem('portfolio-theme', 'light');
                    localStorage.setItem('gkm_theme', 'light');
                }
                if (window.lucide) window.lucide.createIcons();
            };
            const currentTheme = localStorage.getItem('portfolio-theme') || localStorage.getItem('gkm_theme') || 'light';
            applyTheme(currentTheme);
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const isDark = document.documentElement.classList.contains('dark');
                    applyTheme(isDark ? 'light' : 'dark');
                });
            }

            // Mobile Menu Drawer
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileDrawer = document.getElementById('mobile-drawer');
            const mobileDrawerClose = document.getElementById('mobile-drawer-close');
            const mobileDrawerCloseBtn = document.getElementById('mobile-drawer-close-btn');

            if (mobileMenuBtn && mobileDrawer) {
                const openDrawer = () => {
                    mobileDrawer.classList.remove('translate-x-full');
                    document.body.style.overflow = 'hidden';
                };
                const closeDrawer = () => {
                    mobileDrawer.classList.add('translate-x-full');
                    document.body.style.overflow = '';
                };

                mobileMenuBtn.addEventListener('click', openDrawer);
                if (mobileDrawerClose) mobileDrawerClose.addEventListener('click', closeDrawer);
                if (mobileDrawerCloseBtn) mobileDrawerCloseBtn.addEventListener('click', closeDrawer);
            }
        });
    </script>
